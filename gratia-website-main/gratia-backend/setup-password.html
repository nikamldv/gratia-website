
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort einrichten | GRATIA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f3f3f3;
            font-family: Arial, sans-serif;
            color: #292929;
        }

        .password-card {
            width: 100%;
            max-width: 460px;
            padding: 32px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #872020;
            font-size: 26px;
        }

        p {
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #872020;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            overflow-wrap: anywhere;
        }

        .hint {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <main class="password-card">
        <h1>Passwort einrichten</h1>

        <p>
            Willkommen bei GRATIA. Bitte richten Sie Ihr persönliches
            Passwort ein, um Ihr Benutzerkonto zu aktivieren.
        </p>

        <form id="password-form">
            <label for="token">Einladungstoken</label>
            <input
                type="text"
                id="token"
                name="token"
                autocomplete="off"
                required
            >

            <label for="password">Neues Passwort</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <p class="hint">
                Das Passwort muss mindestens 12 Zeichen enthalten.
            </p>

            <label for="password-confirm">Passwort wiederholen</label>
            <input
                type="password"
                id="password-confirm"
                name="password-confirm"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="submit-button">
                Passwort speichern
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script>
        const API_BASE = "http://localhost:3000/api";

        const form = document.getElementById("password-form");
        const tokenInput = document.getElementById("token");
        const passwordInput = document.getElementById("password");
        const confirmInput = document.getElementById("password-confirm");
        const button = document.getElementById("submit-button");
        const message = document.getElementById("message");

        // Token aus der URL übernehmen, falls vorhanden.
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get("token");

        if (urlToken) {
            tokenInput.value = urlToken;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const token = tokenInput.value.trim();
            const password = passwordInput.value;
            const confirmation = confirmInput.value;

            message.textContent = "";
            message.style.color = "#a51d1d";

            if (password.length < 12 || password.length > 128) {
                message.textContent =
                    "Das Passwort muss 12 bis 128 Zeichen enthalten.";
                return;
            }

            if (password !== confirmation) {
                message.textContent =
                    "Die beiden Passwörter stimmen nicht überein.";
                return;
            }

            button.disabled = true;
            button.textContent = "Wird gespeichert ...";

            try {
                const response = await fetch(
                    `${API_BASE}/auth/setup-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token: token,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || data.status !== "OK") {
                    throw new Error(
                        data.message ||
                        "Das Passwort konnte nicht eingerichtet werden."
                    );
                }

                message.style.color = "#176534";
                message.textContent =
                    "Passwort erfolgreich eingerichtet. Sie können sich jetzt anmelden.";

                form.reset();

            } catch (error) {
                message.textContent =
                    error.message ||
                    "Verbindung zum Server fehlgeschlagen.";

            } finally {
                button.disabled = false;
                button.textContent = "Passwort speichern";
            }
        });
    </script>
</body>
</html>
