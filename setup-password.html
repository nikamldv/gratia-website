
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRATIA – Passwort festlegen</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #333;
            min-height: 100vh;
        }

        .admin-header {
            background: #872020;
            color: white;
            padding: 25px 5%;
            min-height: 115px;
        }

        .admin-header h1 {
            margin: 0 0 8px;
            font-size: 25px;
            font-weight: 700;
        }

        .admin-header p {
            margin: 0;
            font-size: 14px;
        }

        .page-content {
            min-height: calc(100vh - 170px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .password-card {
            width: 100%;
            max-width: 390px;
            padding: 30px;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
        }

        .password-card h2 {
            margin: 0 0 12px;
            color: #872020;
            font-size: 22px;
        }

        .description {
            margin: 0 0 20px;
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            display: block;
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d4d4d4;
            border-radius: 6px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #872020;
            box-shadow: 0 0 0 2px rgba(135, 32, 32, 0.10);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #a52a16;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #872020;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #message {
            margin: 14px 0 0;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .admin-footer {
            padding: 18px;
            text-align: center;
            color: #777;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .admin-header {
                padding: 22px 20px;
            }

            .admin-header h1 {
                font-size: 22px;
            }

            .password-card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <header class="admin-header">
        <h1>GRATIA – Mitarbeiterportal</h1>
        <p>Ihr persönlicher Zugang zum Mitarbeiterbereich</p>
    </header>

    <main class="page-content">
        <section class="password-card">
            <h2>Passwort festlegen</h2>

            <p class="description">
                Willkommen bei GRATIA! Bitte erstellen Sie Ihr persönliches
                Passwort, um Ihr Mitarbeiterkonto zu aktivieren.
            </p>

            <form id="passwordForm">
                <div class="form-group">
                    <label for="password">Neues Passwort</label>
                    <input
                        type="password"
                        id="password"
                        minlength="12"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Passwort wiederholen</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        minlength="12"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" id="submitButton">
                    Passwort festlegen
                </button>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer class="admin-footer">
        Pflegedienst GRATIA GmbH · Sicherer Mitarbeiterzugang
    </footer>

    <script>
        const API_BASE = "http://localhost:3000/api";

        const form = document.getElementById("passwordForm");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const token = new URLSearchParams(
                window.location.search
            ).get("token");

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            message.textContent = "";
            message.style.color = "#872020";

            if (!token) {
                message.textContent =
                    "Der Einladungslink enthält keinen Token.";
                return;
            }

            if (password.length < 12 || password.length > 128) {
                message.textContent =
                    "Das Passwort muss zwischen 12 und 128 Zeichen lang sein.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent =
                    "Die Passwörter stimmen nicht überein.";
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Bitte warten …";

            try {
                const response = await fetch(
                    `${API_BASE}/auth/setup-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ token, password })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Das Passwort konnte nicht gespeichert werden."
                    );
                }

                message.style.color = "green";
                message.textContent =
                    data.message ||
                    "Ihr Passwort wurde erfolgreich festgelegt. Ihr Konto ist aktiviert.";

                form.reset();
            } catch (error) {
                message.style.color = "#872020";
                message.textContent =
                    error.message ||
                    "Verbindung zum Server fehlgeschlagen.";
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Passwort festlegen";
            }
        });
    </script>
</body>
</html>
